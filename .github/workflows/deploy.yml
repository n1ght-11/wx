name: wxread-auto-read

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: '0 17 * * *'      # UTC 17:00 = 北京时间 01:00
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: Run reader
        env:
          WXREAD_COOKIES: ${{ secrets.WXREAD_COOKIES }}
          WXREAD_BOOK: ${{ secrets.WXREAD_BOOK }}
          WXREAD_PAGES: ${{ secrets.WXREAD_PAGES || '30' }}
          WXREAD_MINUTES: ${{ secrets.WXREAD_MINUTES || '60' }}
        run: python main.py

      - name: Cookie 过期提醒
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🍪 微信读书 Cookie 可能已过期';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50
            });
            if (issues.some(i => i.title === title)) {
              console.log('已有未关闭的过期提醒，跳过');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: '每日自动阅读任务失败（阅读请求 0 命中或被跳登录页），很可能是 weread 登录 cookie 已失效。\n\n请本地重新运行 `python export_cookies.py` 导出新 cookie，再用 `deploy_push.js` 更新 Secret `WXREAD_COOKIES`，然后到 Actions 页面手动 Run workflow 验证。'
            });
