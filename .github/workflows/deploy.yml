name: wxread-auto-read

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: '0 17 * * *'      # UTC 17:00 = 北京时间 01:00
  workflow_dispatch:
    inputs:
      minutes:
        description: '阅读时长（分钟）。定时触发自动随机 60-240 分钟；手动填写覆盖随机值'
        required: false
        default: '60'

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: Generate random duration
        if: github.event_name == 'schedule'
        id: rand
        run: echo "minutes=$((RANDOM % 181 + 60))" >> $GITHUB_OUTPUT

      - name: Run reader
        env:
          WXREAD_COOKIES: ${{ secrets.WXREAD_COOKIES }}
          WXREAD_BOOK: ${{ secrets.WXREAD_BOOK }}
          WXREAD_MINUTES: ${{ github.event.inputs.minutes || steps.rand.outputs.minutes || '60' }}
          WXREAD_PAGES: ${{ secrets.WXREAD_PAGES || '' }}
        run: python main.py

      - name: Cookie 过期提醒（GitHub Issue）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🍪 微信读书 Cookie 可能已过期';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50
            });
            if (issues.some(i => i.title === title)) {
              console.log('已有未关闭的过期提醒，跳过');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: '每日自动阅读任务失败（阅读请求 0 命中或被跳登录页），很可能是 weread 登录 cookie 已失效。\n\n请本地重新运行 `python export_cookies.py` 导出新 cookie，再用 `deploy_push.js` 更新 Secret `WXREAD_COOKIES`，然后到 Actions 页面手动 Run workflow 验证。'
            });

      - name: 微信推送通知（Server酱）
        if: failure()
        env:
          SC_KEY: ${{ secrets.SC_SENDKEY }}
        run: |
          if [ -z "$SC_KEY" ]; then
            echo "SC_SENDKEY 未设置，跳过微信推送"
            exit 0
          fi
          curl -s -X POST "https://sctapi.ftqq.com/${SC_KEY}.send" \
            -d "title=🍪 微信读书 Cookie 可能已过期" \
            -d "desp=每日自动阅读任务失败，很可能是 weread 登录 cookie 已失效。\n\n**失败时间：** $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')\n\n**处理方法：**\n1. 本地浏览器登录 weread.qq.com\n2. 重新导出 cookie\n3. 更新 GitHub Secret \`WXREAD_COOKIES\`\n4. 手动触发 workflow 验证\n\n[查看运行日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          echo "微信推送已发送"
